# Solo levanta PostgreSQL; Django corre en la máquina que tiene la cámara.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: visionguard
      POSTGRES_USER: visionguard
      POSTGRES_PASSWORD: visionguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
